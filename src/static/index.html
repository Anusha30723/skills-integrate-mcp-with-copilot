<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="auth-container">
        <h3>Student Account</h3>
        <form id="auth-form">
          <div class="form-group">
            <label for="auth-email">Email:</label>
            <input type="email" id="auth-email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="auth-password">Password:</label>
            <input type="password" id="auth-password" required minlength="8" />
          </div>
          <div class="auth-actions">
            <button type="submit" data-action="login">Log In</button>
            <button type="button" id="register-btn" class="secondary-btn">Create Account</button>
            <button type="button" id="logout-btn" class="secondary-btn hidden">Log Out</button>
          </div>
        </form>
        <p id="auth-status" class="hidden"></p>
      </section>

      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
